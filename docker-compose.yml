

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: samaRth7
      MYSQL_DATABASE: geofence   
      MYSQL_ROOT_HOST: "%"  
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psamaRth7"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 140s

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  service-registry:
    build: ./ServiceRegistry
    container_name: service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 50s
    

  api-gateway:
    build: ./ApiGateway
    container_name: api-gateway
    ports:
      - "8080:8080"
   
   
    depends_on:
      service-registry:
        condition: service_healthy

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 35s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped


  user-service:
    ports:
      - "8082:8082"
    build: ./UserService
    container_name: user-service
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_healthy

      service-registry:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/geofence
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: samaRth7

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 140s

  auth-service:
    ports:
     - "8081:8081"
    build: ./AuthService 
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

      service-registry:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/geofence
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: samaRth7


      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka

    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
        interval: 15s
        timeout: 15s
        retries: 10
        start_period: 140s

  email-service:
    build: ./emailService
    container_name: email-service
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

      service-registry:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP: email-group
      SPRING_MAIL_USERNAME: 22bcs162@ietdavv.edu.in
      SPRING_MAIL_PASSWORD: brhvnheetmnisftm


      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 160s
  frontend:
    build: ./React_tutorial/myapp
    container_name: frontend

    ports:
      - "5173:5173"

    depends_on:
       api-gateway:
        condition: service_healthy

    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  mysql-data:
  kafka-data: