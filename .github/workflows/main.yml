name: ZoneShield CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./React_tutorial/myapp
          push: true
          tags: samarth20182004/zoneshield-frontend:latest

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v7
        with:
          context: ./AuthService
          push: true
          tags: samarth20182004/auth-service:latest

      - name: Build and Push User Service
        uses: docker/build-push-action@v7
        with:
          context: ./UserService
          push: true
          tags: samarth20182004/user-service:latest

      - name: Build and Push Email Service
        uses: docker/build-push-action@v7
        with:
          context: ./emailService
          push: true
          tags: samarth20182004/email-service:latest

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v7
        with:
          context: ./ApiGateway
          push: true
          tags: samarth20182004/api-gateway:latest

      - name: Build and Push Service Registry
        uses: docker/build-push-action@v7
        with:
          context: ./ServiceRegistry
          push: true
          tags: samarth20182004/service-registry:latest
